name: Android Debug APK Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Cho phép nhấn nút bấm chạy thủ công trực tiếp trên giao diện Web của GitHub

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Máy ảo GitHub tự tải mã nguồn từ Repository về
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Tự cấu hình môi trường Node.js (Node 22 LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 
          cache: 'npm'

      # Bước 3: Tự cấu hình môi trường Java (Zulu JDK 17 chuẩn Android mới)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' 

      # Bước 4: Tự động quét file lock và cài đặt thư viện Node Modules tại thư mục gốc
      - name: Install dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "pnpm-lock.yaml" ]; then
            corepack enable && pnpm install --frozen-lockfile
          else
            npm install --no-audit --no-fund
          fi

      # Bước 5: Tự khởi tạo file cấu hình Firebase từ GitHub Secret an toàn bảo mật
      - name: Inject Firebase Configuration
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      # Bước 6: Khởi tạo môi trường Android Native độc lập (Bỏ qua cấu hình tự động của Expo)
      - name: Initialize Android Native Files
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        continue-on-error: true

      # Bước 7: Tự động lưu bộ nhớ đệm (Cache) Gradle để tăng tốc độ build cho những lần sau
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Bước 8: Chạy lệnh đóng gói và compile ứng dụng thuần túy bằng Gradle Wrapper độc lập
      - name: Build Debug APK
        run: |
          # Di chuyển vào thư mục android nếu tồn tại, nếu không tự khởi tạo Gradle độc lập tại gốc
          if [ -d "android" ]; then
            cd android
            if [ ! -f "gradlew" ]; then
              echo "⚠️ Không tìm thấy file gradlew. Đang tự động tạo lại..."
              gradle wrapper
            fi
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "⚠️ Không tìm thấy thư mục android native. Chạy khởi tạo Gradle độc lập..."
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      # Bước 9: Thu thập file APK Debug xuất bản ra tab Actions để bạn tải về
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 # Lưu file APK trong 7 ngày
