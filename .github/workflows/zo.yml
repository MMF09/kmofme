name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Đã bỏ cấu hình cache gây lỗi)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Setup Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Cài đặt dependencies (Chạy trực tiếp trong thư mục dự án)
      - name: Install dependencies
        run: |
          if [ -d "km-blackbox-android" ]; then cd km-blackbox-android; fi
          npm install

      # 6. Cấp quyền thực thi cho gradlew
      - name: Make gradlew executable
        run: |
          if [ -d "km-blackbox-android" ]; then cd km-blackbox-android; fi
          chmod +x android/gradlew

      # 7. Build Debug APK
      - name: Build Android Debug APK
        run: |
          if [ -d "km-blackbox-android" ]; then cd km-blackbox-android; fi
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace --info

      # 8. Kiểm tra file APK đã được tạo
      - name: Verify APK exists
        run: |
          APK_DIR="android/app/build/outputs/apk/debug/"
          if [ -d "km-blackbox-android" ]; then APK_DIR="km-blackbox-android/$APK_DIR"; fi
          ls -la $APK_DIR
          test -f ${APK_DIR}app-debug.apk && echo "✅ APK Debug đã được tạo thành công"

      # 9. Upload APK Debug lên Artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            km-blackbox-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
