name: Android Debug APK Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub Web

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    # Ép tất cả các bước (steps) chạy bên trong thư mục dự án của bạn
    defaults:
      run:
        working-directory: km-blackbox-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Sử dụng Node 22 LTS để đảm bảo tính ổn định
          cache: 'npm' # Ép nhận diện cache theo package-lock.json của km-blackbox-android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Phiên bản Java chuẩn hóa cho React Native thế hệ mới

      - name: Install dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "pnpm-lock.yaml" ]; then
            corepack enable && pnpm install --frozen-lockfile
          else
            npm install --no-audit --no-fund # Cài đặt dự phòng nếu dự án chưa có file lock
          fi

      # Sinh thư mục android và cấu hình Gradle tự động (Bắt buộc cho dự án Expo)
      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('km-blackbox-android/**/*.gradle*', 'km-blackbox-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Request Android Permissions & Build Asset Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        continue-on-error: true # Bỏ qua nếu cấu hình dự án của bạn tự động hóa phần đóng gói này qua Gradle

      - name: Build Debug APK
        working-directory: km-blackbox-android/android # Trỏ chính xác vào thư mục android bên trong thư mục gốc dự án
        run: |
          # Kiểm tra nếu thiếu file gradlew thì tự động khởi tạo lại wrapper
          if [ ! -f "gradlew" ]; then
            echo "⚠️ Không tìm thấy file gradlew. Đang tự động tạo lại..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          # Trỏ chính xác đến đường dẫn file APK sinh ra
          path: km-blackbox-android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 # Lưu trữ file APK trong 7 ngày trên GitHub để tải về
