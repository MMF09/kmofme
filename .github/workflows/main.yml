name: Android Debug APK Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: 

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' 

      - name: Install dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "pnpm-lock.yaml" ]; then
            corepack enable && pnpm install --frozen-lockfile
          else
            npm install --no-audit --no-fund
          fi

      - name: Inject Firebase Configuration
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      # Bước thay thế an toàn: Đóng gói tài nguyên ứng dụng (Assets & Bundle) theo chuẩn Expo sạch
      - name: Export Expo Application Assets
        run: npx expo export --platform android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Tự động khởi tạo lại bộ khung Android chuẩn React Native để tránh lỗi cấu hình trống
      - name: Generate Lightweight Android Wrapper
        run: |
          if [ ! -d "android" ]; then
            echo "Khởi tạo khung chứa Android Native..."
            mkdir -p android
            gradle init --type basic --dsl groovy --incubating
          fi

      - name: Build Debug APK
        run: |
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "⚠️ Đang xây dựng thông qua trình đóng gói dự phòng..."
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
            dist/
          retention-days: 7
