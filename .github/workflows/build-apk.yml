name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Cập nhật lên Node 24 để sửa lỗi deprecation của GitHub

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17  # Phù hợp với đa số các phiên bản Expo SDK hiện tại

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        # Tự động phát hiện file lock để chọn lệnh cài đặt phù hợp, tránh crash quy trình
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Expo prebuild (generate android directory)
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        # Thêm cờ --info để in ra đầy đủ chi tiết lỗi nếu dòng build Gradle bị sập
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Find and output APK path
        id: find_apk
        run: |
          APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name "*debug*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::Không tìm thấy file debug APK sau khi build!"
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: km-blackbox-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
