name: Build Android Debug APK (Expo)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      # Ép kiểm tra đồng bộ phiên bản lần cuối trước khi prebuild
      - name: Verify Expo Package Versions
        run: npx expo install --check

      # Sinh thư mục android sạch từ phôi dự án gốc
      - name: Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Find and output APK path
        id: find_apk
        run: |
          APK_PATH=$(find android -name "*.apk" | grep -i "debug" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Không tìm thấy file debug APK sau khi build!"
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
