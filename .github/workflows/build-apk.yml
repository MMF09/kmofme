name: Build Android Debug APK (React Native CLI)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      # Tự động tạo thư mục android gốc nếu bạn lỡ dùng .gitignore chặn nó trước đó
      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Thư mục android không tồn tại! Tự động tạo khung dự án qua React Native CLI..."
            npx react-native @react-native-community/cli android
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Find and output APK path
        id: find_apk
        run: |
          APK_PATH=$(find android -name "*.apk" -path "*/debug/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name "*debug*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::Không tìm thấy file debug APK sau khi build!"
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
