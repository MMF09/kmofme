name: Build Android Debug APK (Expo)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - ".gitignore"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Chuyển Java sang phiên bản 17 (ổn định nhất cho đa số Expo SDK hiện tại)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sửa lỗi: Xóa sạch bộ nhớ đệm cục bộ của các gói cài đặt cũ nếu có xung đột
      - name: Install Node dependencies
        run: |
          npm ci || npm install

      # BẮT BUỘC: Đồng bộ và sửa các phiên bản package Expo bị lệch trước khi prebuild
      - name: Fix and Verify Expo Package Versions
        run: |
          npx expo install --check
          npx expo install --fix

      # Sửa lỗi: Tạo mới thư mục android với cờ --clean để xóa dấu vết cấu hình cũ
      - name: Expo Prebuild (Clean Generate Android Folder)
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # Sửa lỗi: Thêm lệnh loại bỏ cache cục bộ của gradle trước khi biên dịch chính thức
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Find and output APK path
        id: find_apk
        run: |
          APK_PATH=$(find android -name "*.apk" | grep -i "debug" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Không tìm thấy file debug APK sau khi build!"
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
